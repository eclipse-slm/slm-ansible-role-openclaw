---
- name: Restart openclaw gateway
  ansible.builtin.systemd_service:
    name: "{{ slm_ansible_role_openclaw_service_name }}"
    state: restarted
    daemon_reload: true

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Reload caddy
  ansible.builtin.systemd_service:
    name: caddy
    state: reloaded
