---
- name: VERIFY | UNINSTALL OPENCLAW
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Read service facts
      ansible.builtin.service_facts:

    - name: Assert gateway service is gone
      ansible.builtin.assert:
        that:
          - "'openclaw-gateway.service' not in ansible_facts.services"
        fail_msg: openclaw-gateway.service still present

    - name: Stat removed paths
      ansible.builtin.stat:
        path: "{{ item }}"
      register: __verify_removed
      loop:
        - /etc/systemd/system/openclaw-gateway.service
        - /usr/bin/openclaw
        - /var/lib/openclaw
        - /etc/apt/sources.list.d/nodesource.sources
        - /etc/systemd/system/oauth2-proxy.service
        - /usr/local/bin/oauth2-proxy
        - /etc/oauth2-proxy
        - /etc/caddy/certs/openclaw.crt
        - /etc/caddy/certs/openclaw.key

    - name: Assert paths are removed
      ansible.builtin.assert:
        that:
          - not item.stat.exists
        fail_msg: "{{ item.item }} still exists"
      loop: "{{ __verify_removed.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Read service user
      ansible.builtin.getent:
        database: passwd
        key: openclaw
        fail_key: false

    - name: Assert service user is removed
      ansible.builtin.assert:
        that:
          - ansible_facts['getent_passwd']['openclaw'] is none
        fail_msg: user openclaw still exists

    - name: Read oauth2-proxy user
      ansible.builtin.getent:
        database: passwd
        key: oauth2-proxy
        fail_key: false

    - name: Assert oauth2-proxy user is removed
      ansible.builtin.assert:
        that:
          - ansible_facts['getent_passwd']['oauth2-proxy'] is none
        fail_msg: user oauth2-proxy still exists

    - name: Read package facts
      ansible.builtin.package_facts:

    - name: Assert nodejs is removed
      ansible.builtin.assert:
        that:
          - "'nodejs' not in ansible_facts.packages"
        fail_msg: nodejs package still installed

    # slm_ansible_role_openclaw_uninstall_caddy defaults to false
    - name: Assert caddy is kept
      ansible.builtin.assert:
        that:
          - "'caddy' in ansible_facts.packages"
        fail_msg: caddy was removed although uninstall_caddy is false

    # The kept Caddy must not point at the removed gateway, oauth2-proxy or certs
    - name: Validate the remaining Caddyfile
      ansible.builtin.command: caddy validate --adapter caddyfile --config /etc/caddy/Caddyfile
      changed_when: false

    - name: Read the remaining Caddyfile
      ansible.builtin.slurp:
        path: /etc/caddy/Caddyfile
      register: __verify_caddyfile

    - name: Assert the remaining Caddyfile has no OpenClaw site
      ansible.builtin.assert:
        that:
          - "'reverse_proxy' not in __verify_caddyfile.content | b64decode"
          - "'/etc/caddy/certs/openclaw' not in __verify_caddyfile.content | b64decode"
        fail_msg: "Caddyfile still serves OpenClaw: {{ __verify_caddyfile.content | b64decode }}"

# absent must also work on a host where nothing is installed, including
# hosts without python3-debian (needed by deb822_repository)
- name: VERIFY | ABSENT ON A CLEAN HOST
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Remove python3-debian
      ansible.builtin.apt:
        name: python3-debian
        state: absent

    - name: Apply role with state absent on a clean host
      ansible.builtin.include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
      vars:
        slm_ansible_role_openclaw_state: absent
        slm_ansible_role_openclaw_uninstall_nodejs: true
        slm_ansible_role_openclaw_uninstall_purge: true
