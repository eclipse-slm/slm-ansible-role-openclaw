---
# Role input shared by all converge and prepare playbooks. The token contains
# characters that must survive the .env file literally.
slm_ansible_role_openclaw_config:
  # Owner-only tool exposed over HTTP so verify can tell admin from non-admin users
  gateway:
    tools:
      allow:
        - gateway
  agents:
    defaults:
      heartbeat:
        every: 2h
slm_ansible_role_openclaw_env:
  DUMMY_PROVIDER_KEY: not-a-real-key
slm_ansible_role_openclaw_gateway_token: 'molecule-gw-t0ken'
slm_ansible_role_openclaw_gateway_password: molecule-gw-Pa55
# Passwords molecule-Pa55 (admin) and viewer-Pa55 (no admin)
slm_ansible_role_openclaw_proxy_basic_users:
  - name: molecule
    password_hash: '$2b$14$H81L2RzQQsxVL4VXLARLeekuBkRElmiX7tr7I.Tp7ukUKrftScMJ6'
  - name: viewer
    password_hash: '$2b$14$qe1Ur3i4/6.NfOcbEkqWJeTj/SlEkWZDRYSOtpywg6QJYkiSwgV6q'
slm_ansible_role_openclaw_proxy_admin_users:
  - molecule
# Nothing listens on port 9: proves openclaw accepts the provider block, not the endpoint
slm_ansible_role_openclaw_openai_providers:
  - id: "{{ lookup('env', 'OPENCLAW_OPENAI_ID') | default('openapi', true) }}"
    base_url: "{{ lookup('env', 'OPENCLAW_OPENAI_BASE_URL') | default('http://127.0.0.1:9/v1', true) }}"
    api_key: "{{ lookup('env', 'OPENCLAW_OPENAI_API_KEY') | default('fake-llm-k3y', true) }}"
    models:
      - id: "{{ lookup('env', 'OPENCLAW_OPENAI_MODEL_ID') | default('deepseek-ai/DeepSeek-V4-Flash-0731', true) }}"
        name: Model 1
        context_window: 32768
        max_tokens: 4096
  # No models: looked up from the fake endpoint started by default-install/prepare.yml
  - id: disc-llm
    base_url: http://127.0.0.1:8099/v1
slm_ansible_role_openclaw_default_model: "{{ lookup('env', 'OPENCLAW_OPENAI_ID') | default('openapi', true) }}/{{ lookup('env', 'OPENCLAW_OPENAI_MODEL_ID') | default('deepseek-ai/DeepSeek-V4-Flash-0731', true) }}"
