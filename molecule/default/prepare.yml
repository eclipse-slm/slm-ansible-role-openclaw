---
- name: Prepare - wait for SSH on all inventory hosts
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars:
    ssh_wait_timeout: 300
    ssh_wait_delay: 0
    ssh_wait_connect_timeout: 5
    ssh_wait_sleep: 2
  tasks:
    - name: Wait for SSH to become available
      ansible.builtin.wait_for:
        host: "{{ hostvars[item].ansible_host | default(item) }}"
        port: "{{ hostvars[item].ansible_port | default(22) }}"
        timeout: "{{ ssh_wait_timeout }}"
        delay: "{{ ssh_wait_delay }}"
        connect_timeout: "{{ ssh_wait_connect_timeout }}"
        sleep: "{{ ssh_wait_sleep }}"
      loop: "{{ groups['all'] | default([]) }}"
      loop_control:
        label: "{{ item }}"

# Static OpenAI-style model listing for the provider without models in vars.yml; shared
# by every scenario because vars.yml is
- name: PREPARE | FAKE OPENAI MODEL ENDPOINT
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Create fake model listing directory
      ansible.builtin.file:
        path: /srv/fake-models/v1
        state: directory
        mode: "0755"

    - name: Create fake model listing
      ansible.builtin.copy:
        content: '{"object": "list", "data": [{"id": "disc-alpha", "object": "model"}, {"id": "disc-beta", "object": "model"}]}'
        dest: /srv/fake-models/v1/models
        mode: "0644"

    - name: Read service facts
      ansible.builtin.service_facts:

    # Transient unit: gone after a reboot, which molecule never does
    - name: Start fake model endpoint
      ansible.builtin.command: >-
        systemd-run --unit fake-models
        python3 -m http.server 8099 --bind 127.0.0.1 --directory /srv/fake-models
      changed_when: true
      when: ansible_facts.services['fake-models.service'].state | default('') != 'running'
