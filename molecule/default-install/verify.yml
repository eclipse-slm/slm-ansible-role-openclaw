---
- name: VERIFY | INSTALL OPENCLAW
  hosts: all
  become: true
  gather_facts: false
  # Expected provider values come from the same input as converge
  vars_files:
    - ../default/vars.yml
  vars:
    __provider: "{{ slm_ansible_role_openclaw_openai_providers[0] }}"
    __provider_env: "OPENCLAW_PROVIDER_{{ __provider.id | upper | replace('-', '_') }}_API_KEY"
  tasks:
    - name: Read Node.js version
      ansible.builtin.command: node --version
      changed_when: false
      register: __verify_node

    - name: Assert Node.js version satisfies openclaw engines
      vars:
        __node_version: "{{ __verify_node.stdout | trim | regex_replace('^v', '') }}"
      ansible.builtin.assert:
        that:
          - >-
            (__node_version is version('24.16.0', '>=') and __node_version is version('25', '<'))
            or __node_version is version('26.1.0', '>=')
        fail_msg: "Node.js {{ __node_version }} does not satisfy >=24.16.0 <25 || >=26.1.0"
        success_msg: "Node.js {{ __node_version }} is supported"

    - name: Read service user
      ansible.builtin.getent:
        database: passwd
        key: openclaw

    - name: Assert service user home and shell
      ansible.builtin.assert:
        that:
          - ansible_facts['getent_passwd']['openclaw'][4] == '/var/lib/openclaw'
          - ansible_facts['getent_passwd']['openclaw'][5] == '/usr/sbin/nologin'
        fail_msg: "Unexpected passwd entry: {{ ansible_facts['getent_passwd']['openclaw'] }}"

    - name: Stat state directory
      ansible.builtin.stat:
        path: /var/lib/openclaw/.openclaw
      register: __verify_state_dir

    - name: Assert state directory is private to the service user
      ansible.builtin.assert:
        that:
          - __verify_state_dir.stat.isdir
          - __verify_state_dir.stat.mode == '0700'
          - __verify_state_dir.stat.pw_name == 'openclaw'
        fail_msg: "State dir not 0700/openclaw: {{ __verify_state_dir.stat }}"

    - name: Read openclaw version
      ansible.builtin.command: /usr/bin/openclaw --version
      changed_when: false
      register: __verify_openclaw_version

    - name: Assert pinned openclaw version is installed
      ansible.builtin.assert:
        that:
          - "'OpenClaw 2026.10.4' in __verify_openclaw_version.stdout"
        fail_msg: "Expected OpenClaw 2026.10.4, got: {{ __verify_openclaw_version.stdout }}"

    - name: Stat config and env files
      ansible.builtin.stat:
        path: "{{ item }}"
      register: __verify_config_files
      loop:
        - /var/lib/openclaw/.openclaw/openclaw.json
        - /var/lib/openclaw/.openclaw/.env

    - name: Assert config and env files are private to the service user
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.mode == '0600'
          - item.stat.pw_name == 'openclaw'
        fail_msg: "{{ item.item }} missing or not 0600/openclaw"
      loop: "{{ __verify_config_files.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Read rendered config
      ansible.builtin.slurp:
        path: /var/lib/openclaw/.openclaw/openclaw.json
      register: __verify_config_raw

    - name: Assert rendered config content
      vars:
        __text: "{{ __verify_config_raw.content | b64decode }}"
        __cfg: "{{ __text | from_json }}"
      ansible.builtin.assert:
        that:
          - __cfg.gateway.mode == 'local'
          - __cfg.gateway.bind == 'loopback'
          - __cfg.gateway.port == 18789
          - __cfg.gateway.publicOrigin == 'https://' ~ ansible_host
          - __cfg.gateway.trustedProxies == ['127.0.0.1']
          - __cfg.gateway.auth.mode == 'trusted-proxy'
          - __cfg.gateway.auth.password == '${OPENCLAW_GATEWAY_PASSWORD}'
          - "'token' not in __cfg.gateway.auth"
          - "__cfg.gateway.auth.identityScopes == {'molecule': ['operator.admin']}"
          - __cfg.gateway.auth.trustedProxy.allowUsers == ['molecule', 'viewer']
          - __cfg.gateway.auth.trustedProxy.allowLoopback
          - __cfg.gateway.auth.trustedProxy.deviceAutoApprove.enabled
          - __cfg.agents.defaults.workspace == '/var/lib/openclaw/.openclaw/workspace'
          - __cfg.agents.defaults.heartbeat.every == '2h'
          - __cfg.models.providers[__provider.id].baseUrl == __provider.base_url
          - >-
            __cfg.models.providers[__provider.id].apiKey == '${' ~ __provider_env ~ '}'
          - __cfg.agents.defaults.model.primary == slm_ansible_role_openclaw_default_model
          - __provider.api_key not in __text
          - >-
            __cfg.models.providers['disc-llm'].models == [{'id': 'disc-alpha', 'name': 'disc-alpha'},
            {'id': 'disc-beta', 'name': 'disc-beta'}]
          - slm_ansible_role_openclaw_gateway_token not in __text
        fail_msg: "Unexpected openclaw.json: {{ __text }}"

    - name: Find files under the state directory
      ansible.builtin.find:
        paths: /var/lib/openclaw/.openclaw
        recurse: true
        file_type: any
        hidden: true
      register: __verify_state_files

    - name: Assert no file under the state directory is owned by another user
      ansible.builtin.assert:
        that:
          - __verify_state_files.files | rejectattr('pw_name', 'equalto', 'openclaw') | list | length == 0
        fail_msg: >-
          Not owned by openclaw:
          {{ __verify_state_files.files | rejectattr('pw_name', 'equalto', 'openclaw') | map(attribute='path') | list }}

    - name: Read env file
      ansible.builtin.slurp:
        path: /var/lib/openclaw/.openclaw/.env
      register: __verify_env_raw
      no_log: true

    - name: Assert env file holds single-quoted secrets
      vars:
        __lines: "{{ (__verify_env_raw.content | b64decode).splitlines() }}"
      ansible.builtin.assert:
        that:
          - >-
            "OPENCLAW_GATEWAY_PASSWORD='molecule-gw-Pa55'" in __lines
          - __lines | select('match', 'OPENCLAW_GATEWAY_TOKEN=') | list | length == 0
          - >-
            "DUMMY_PROVIDER_KEY='not-a-real-key'" in __lines
          - __provider_env ~ "='" ~ __provider.api_key ~ "'" in __lines
        fail_msg: .env does not contain the expected single-quoted entries
      no_log: true

    - name: Checksum config before applying an invalid one
      ansible.builtin.stat:
        path: /var/lib/openclaw/.openclaw/openclaw.json
      register: __verify_config_before

    - name: Apply config with an unknown key
      block:
        - name: Run role config tasks with an unknown key
          ansible.builtin.include_role:
            name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
            tasks_from: install/config.yml
          vars:
            slm_ansible_role_openclaw_config:
              gateway:
                bogus: 1
            slm_ansible_role_openclaw_gateway_password: verify-password
            # Facts are not gathered in verify
            slm_ansible_role_openclaw_proxy_hostname: "{{ ansible_host }}"

        - name: Record that the invalid config was accepted
          ansible.builtin.set_fact:
            __verify_bad_config_rejected: false
      rescue:
        # Only a failed `openclaw config validate` counts, not any other error
        - name: Record that the invalid config was rejected
          ansible.builtin.set_fact:
            __verify_bad_config_rejected: "{{ 'Unrecognized key' in ansible_failed_result.stderr | default('') }}"

    - name: Checksum config after applying an invalid one
      ansible.builtin.stat:
        path: /var/lib/openclaw/.openclaw/openclaw.json
      register: __verify_config_after

    - name: Assert invalid config was rejected and the existing one kept
      ansible.builtin.assert:
        that:
          - __verify_bad_config_rejected | bool
          - __verify_config_before.stat.checksum == __verify_config_after.stat.checksum
        fail_msg: Unknown config key was not rejected or openclaw.json was replaced

    - name: Stat systemd unit
      ansible.builtin.stat:
        path: /etc/systemd/system/openclaw-gateway.service
      register: __verify_unit

    - name: Read service facts
      ansible.builtin.service_facts:

    - name: Assert gateway service is running and enabled
      ansible.builtin.assert:
        that:
          - __verify_unit.stat.exists
          - "'openclaw-gateway.service' in ansible_facts.services"
          - ansible_facts.services['openclaw-gateway.service'].state == 'running'
          - ansible_facts.services['openclaw-gateway.service'].status == 'enabled'
        fail_msg: openclaw-gateway.service is missing, not running or not enabled
        success_msg: openclaw-gateway.service is running and enabled

    - name: Wait for gateway port
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 18789
        timeout: 120

    - name: Assert gateway port is closed from the control node
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 18789
        state: stopped
        timeout: 10
      delegate_to: localhost
      become: false

    - name: Assert caddy is running and enabled
      ansible.builtin.assert:
        that:
          - ansible_facts.services['caddy.service'].state == 'running'
          - ansible_facts.services['caddy.service'].status == 'enabled'
        fail_msg: caddy.service is missing, not running or not enabled

    - name: Request the proxy from the control node
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}{{ item.path }}"
        validate_certs: false
        url_username: "{{ item.user | default(omit) }}"
        url_password: "{{ item.password | default(omit) }}"
        force_basic_auth: "{{ item.user is defined }}"
        headers: "{{ item.headers | default({}) }}"
        status_code: "{{ item.status }}"
      delegate_to: localhost
      become: false
      loop:
        - {name: no credentials, path: /, status: 401}
        - {name: wrong password, path: /, user: molecule, password: wrong, status: 401}
        - {name: forged identity header, path: /, headers: {X-Forwarded-User: molecule}, status: 401}
        - {name: valid credentials, path: /, user: molecule, password: molecule-Pa55, status: 200}
        - {name: gateway accepts proxy identity, path: /control-ui-config.json, user: molecule, password: molecule-Pa55, status: 200}
      loop_control:
        label: "{{ item.name }}"

    # Without a scopes header OpenClaw grants trusted-proxy HTTP callers operator.admin;
    # the owner-only gateway tool must only answer proxy_admin_users
    - name: Call an owner-only tool through the proxy
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}/tools/invoke"
        method: POST
        body_format: json
        body: {tool: gateway, action: config.get, args: {path: gateway.mode}}
        validate_certs: false
        url_username: "{{ item.user }}"
        url_password: "{{ item.password }}"
        force_basic_auth: true
        headers: "{{ item.headers | default({}) }}"
        status_code: "{{ item.status }}"
      delegate_to: localhost
      become: false
      loop:
        - {user: molecule, password: molecule-Pa55, status: 200}
        - {user: viewer, password: viewer-Pa55, status: [403, 404]}
        - {user: viewer, password: viewer-Pa55, headers: {X-Openclaw-Scopes: operator.admin}, status: [403, 404]}
      loop_control:
        label: "{{ item.user }} {{ item.headers | default({}) }}"

    - name: List models as service user
      ansible.builtin.command: /usr/bin/openclaw models list --json
      become: true
      become_user: openclaw
      environment:
        OPENCLAW_CONFIG_PATH: /var/lib/openclaw/.openclaw/openclaw.json
        OPENCLAW_STATE_DIR: /var/lib/openclaw/.openclaw
      changed_when: false
      register: __verify_models

    - name: Assert the OpenAI-compatible model is listed
      ansible.builtin.assert:
        that:
          - slm_ansible_role_openclaw_default_model in __verify_models.stdout
          - "'disc-llm/disc-alpha' in __verify_models.stdout"
          - "'disc-llm/disc-beta' in __verify_models.stdout"
        fail_msg: "Configured or discovered models missing from: {{ __verify_models.stdout }}"

    - name: Read gateway status as service user
      ansible.builtin.command: /usr/bin/openclaw gateway status
      become: true
      become_user: openclaw
      environment:
        OPENCLAW_CONFIG_PATH: /var/lib/openclaw/.openclaw/openclaw.json
        OPENCLAW_STATE_DIR: /var/lib/openclaw/.openclaw
      changed_when: false
      register: __verify_gateway_status

    - name: Assert gateway answers the connectivity probe
      ansible.builtin.assert:
        that:
          - __verify_gateway_status.rc == 0
          - "'Connectivity probe: ok' in __verify_gateway_status.stdout"
        fail_msg: "Gateway status failed: {{ __verify_gateway_status.stdout }}"

    - name: Install pairing test client dependencies on the control node
      ansible.builtin.pip:
        name:
          - websockets
          - cryptography
        virtualenv: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/pair-venv"
        virtualenv_command: python3 -m venv
      delegate_to: localhost
      become: false

    # Connects through Caddy like the Control UI with a new device identity
    - name: Connect a new browser device through the proxy
      ansible.builtin.command:
        argv:
          - "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/pair-venv/bin/python"
          - -I
          - "{{ playbook_dir }}/files/pair_client.py"
          - "wss://{{ ansible_host }}/"
          - "https://{{ ansible_host }}"
          - molecule
          - molecule-Pa55
      delegate_to: localhost
      become: false
      changed_when: false
      register: __verify_pair_client

    - name: Read devices as service user
      ansible.builtin.command: /usr/bin/openclaw devices list --json
      become: true
      become_user: openclaw
      environment:
        OPENCLAW_CONFIG_PATH: /var/lib/openclaw/.openclaw/openclaw.json
        OPENCLAW_STATE_DIR: /var/lib/openclaw/.openclaw
      changed_when: false
      register: __verify_devices

    - name: Assert the new device was approved without manual pairing
      vars:
        __client: "{{ __verify_pair_client.stdout | from_json }}"
        __devices: "{{ __verify_devices.stdout | from_json }}"
        __paired: "{{ __devices.paired | selectattr('deviceId', 'equalto', __client.deviceId) | list }}"
      ansible.builtin.assert:
        that:
          - __client.payload.auth.method == 'trusted-proxy'
          - __devices.pending | selectattr('deviceId', 'equalto', __client.deviceId) | list | length == 0
          - __paired | length == 1
          - __paired[0].clientId == 'openclaw-control-ui'
          - "'operator.admin' not in __paired[0].scopes"
        fail_msg: "Device not auto-approved: client={{ __client }} devices={{ __devices }}"
