---
dependency:
  name: galaxy
  options:
    ignore-certs: false
    ignore-errors: false
    role-file: requirements.yml
    requirements-file: requirements.yml

platforms:
  - name: openclaw-uninstall-ubuntu2204
    image: quay.io/containerdisks/ubuntu:22.04
    volume_size: 15Gi

ansible:
  cfg:
    defaults:
      host_key_checking: false
      verbosity: 1
    ssh_connection:
      pipelining: true
  env:
    ANSIBLE_FORCE_COLOR: "1"
    ANSIBLE_LOAD_CALLBACK_PLUGINS: "1"

  executor:
    backend: ansible-playbook
    args:
      ansible_playbook:
        - --diff
        - --force-handlers

  playbooks:
    create: ../default/create-kv.yml
    destroy: ../default/destroy-kv.yml
    prepare: ../default-uninstall/prepare.yml
    converge: ../default-uninstall/converge.yml
    verify: ../default-uninstall/verify.yml

scenario:
  name: uninstall-ubuntu2204-kv
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
