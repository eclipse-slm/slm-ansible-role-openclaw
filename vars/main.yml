---
__slm_ansible_role_openclaw_supported_versions:
  - '22.04'
  - '24.04'

__slm_ansible_role_openclaw_states:
  - present
  - absent

__slm_ansible_role_openclaw_proxy_auths:
  - basic
  - oidc

__slm_ansible_role_openclaw_proxy_tls_modes:
  - internal
  - acme
  - files

# Identities the proxy may pass to the gateway (trustedProxy.allowUsers)
__slm_ansible_role_openclaw_proxy_allowed_users: >-
  {{ slm_ansible_role_openclaw_proxy_basic_users | map(attribute='name') | list
     if slm_ansible_role_openclaw_proxy_auth == 'basic'
     else slm_ansible_role_openclaw_proxy_oidc_allowed_emails }}

__slm_ansible_role_openclaw_bin: /usr/bin/openclaw
__slm_ansible_role_openclaw_unit_path: "/etc/systemd/system/{{ slm_ansible_role_openclaw_service_name }}.service"

__slm_ansible_role_openclaw_caddy_uri: https://dl.cloudsmith.io/public/caddy/stable/deb/debian
__slm_ansible_role_openclaw_caddy_key: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
__slm_ansible_role_openclaw_caddy_cert_dir: /etc/caddy/certs

__slm_ansible_role_openclaw_oauth2_proxy_bin: /usr/local/bin/oauth2-proxy
__slm_ansible_role_openclaw_oauth2_proxy_conf_dir: /etc/oauth2-proxy
__slm_ansible_role_openclaw_oauth2_proxy_unit_path: /etc/systemd/system/oauth2-proxy.service
__slm_ansible_role_openclaw_oauth2_proxy_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts['architecture']] }}"
__slm_ansible_role_openclaw_oauth2_proxy_release: >-
  oauth2-proxy-v{{ slm_ansible_role_openclaw_oauth2_proxy_version }}.linux-{{ __slm_ansible_role_openclaw_oauth2_proxy_arch }}
__slm_ansible_role_openclaw_oauth2_proxy_url: >-
  https://github.com/oauth2-proxy/oauth2-proxy/releases/download/v{{ slm_ansible_role_openclaw_oauth2_proxy_version
  }}/{{ __slm_ansible_role_openclaw_oauth2_proxy_release }}.tar.gz

# forward_auth only needs the auth endpoint; static://202 answers authenticated requests
__slm_ansible_role_openclaw_oauth2_proxy_config: >-
  {{ {'http_address': '127.0.0.1:4180',
      'provider': 'oidc',
      'oidc_issuer_url': slm_ansible_role_openclaw_proxy_oidc_issuer_url,
      'client_id': slm_ansible_role_openclaw_proxy_oidc_client_id,
      'client_secret': slm_ansible_role_openclaw_proxy_oidc_client_secret,
      'cookie_secret': slm_ansible_role_openclaw_proxy_oidc_cookie_secret,
      'cookie_secure': true,
      'redirect_url': __slm_ansible_role_openclaw_proxy_origin ~ '/oauth2/callback',
      'authenticated_emails_file': __slm_ansible_role_openclaw_oauth2_proxy_conf_dir ~ '/emails',
      'upstreams': ['static://202'],
      'reverse_proxy': true,
      'set_xauthrequest': true}
     | combine(slm_ansible_role_openclaw_proxy_oidc_extra_config) }}

__slm_ansible_role_openclaw_nodesource_uri: "https://deb.nodesource.com/node_{{ slm_ansible_role_openclaw_nodejs_major }}.x"
__slm_ansible_role_openclaw_nodesource_key: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key

# Browser origin of the proxy; Caddy site address, publicOrigin and OIDC redirect
__slm_ansible_role_openclaw_proxy_origin: >-
  https://{{ slm_ansible_role_openclaw_proxy_hostname }}{{
  '' if slm_ansible_role_openclaw_proxy_https_port | int == 443
  else ':' ~ slm_ansible_role_openclaw_proxy_https_port }}

# Scope header Caddy sends per identity (x-openclaw-scopes). Admins keep OpenClaw's
# full default set; everyone else gets the scopes auto-approved devices receive.
__slm_ansible_role_openclaw_proxy_admin_scopes:
  - operator.admin
  - operator.read
  - operator.write
  - operator.approvals
  - operator.questions
  - operator.pairing
  - operator.talk.secrets
__slm_ansible_role_openclaw_proxy_user_scopes:
  - operator.read
  - operator.write
  - operator.approvals
  - operator.questions
__slm_ansible_role_openclaw_proxy_identity_placeholder: >-
  {{ '{http.auth.user.id}' if slm_ansible_role_openclaw_proxy_auth == 'basic'
     else '{http.request.header.X-Forwarded-User}' }}

# Secrets stay ${VAR} references; the values only live in the .env file
__slm_ansible_role_openclaw_token_config:
  gateway:
    mode: local
    bind: loopback
    port: "{{ slm_ansible_role_openclaw_gateway_port | int }}"
    auth:
      mode: token
      token: "${OPENCLAW_GATEWAY_TOKEN}"
  agents:
    defaults:
      workspace: "{{ slm_ansible_role_openclaw_state_dir }}/workspace"

# Caddy on the same host is the only remote path; the password is for local CLI calls
__slm_ansible_role_openclaw_proxy_config:
  gateway:
    mode: local
    bind: loopback
    port: "{{ slm_ansible_role_openclaw_gateway_port | int }}"
    publicOrigin: "{{ __slm_ansible_role_openclaw_proxy_origin }}"
    trustedProxies:
      - 127.0.0.1
    auth: "{{ __slm_ansible_role_openclaw_proxy_auth_config }}"
  agents:
    defaults:
      workspace: "{{ slm_ansible_role_openclaw_state_dir }}/workspace"

__slm_ansible_role_openclaw_proxy_auth_config: >-
  {{ {'mode': 'trusted-proxy',
      'password': '${OPENCLAW_GATEWAY_PASSWORD}',
      'trustedProxy': {
        'userHeader': 'x-forwarded-user',
        'requiredHeaders': ['x-forwarded-proto', 'x-forwarded-host'],
        'allowUsers': __slm_ansible_role_openclaw_proxy_allowed_users,
        'allowLoopback': true,
        'deviceAutoApprove': {'enabled': true}}}
     | combine({'identityScopes': dict(slm_ansible_role_openclaw_proxy_admin_users
                                      | product([['operator.admin']]))}
               if slm_ansible_role_openclaw_proxy_admin_users | length > 0 else {}) }}

__slm_ansible_role_openclaw_base_config: >-
  {{ __slm_ansible_role_openclaw_proxy_config
     if slm_ansible_role_openclaw_proxy_enabled | bool
     else __slm_ansible_role_openclaw_token_config }}

__slm_ansible_role_openclaw_openai_apis:
  - openai-completions
  - openai-responses

# API keys stay ${VAR} references; local servers without auth get a fixed placeholder.
# Providers without models use the ids found by tasks/install/models.yml.
__slm_ansible_role_openclaw_openai_providers_json: >-
  {%- set out = {} -%}
  {%- for p in slm_ansible_role_openclaw_openai_providers -%}
  {%- set models = [] -%}
  {%- set listed = p.models | default([]) if p.models | default([]) | length > 0
        else (__slm_ansible_role_openclaw_discovered_models | default({}))[p.id] | default([]) -%}
  {%- for item in listed -%}
  {%- set m = item if item is mapping else {'id': item} -%}
  {#- OpenClaw requires a name; it defaults to the id -#}
  {%- set e = {'id': m.id, 'name': m.name | default(m.id)} -%}
  {%- if m.context_window is defined -%}{%- set _ = e.update({'contextWindow': m.context_window | int}) -%}{%- endif -%}
  {%- if m.max_tokens is defined -%}{%- set _ = e.update({'maxTokens': m.max_tokens | int}) -%}{%- endif -%}
  {%- if m.input is defined -%}{%- set _ = e.update({'input': m.input}) -%}{%- endif -%}
  {%- set _ = models.append(e) -%}
  {%- endfor -%}
  {%- set _ = out.update({p.id: {
        'baseUrl': p.base_url,
        'api': p.api | default('openai-completions'),
        'apiKey': ('${' ~ __slm_ansible_role_openclaw_openai_key_var_prefix ~ (p.id | upper | replace('-', '_')) ~ '_API_KEY}')
                  if p.api_key | default('') | length > 0 else 'no-key',
        'models': models}}) -%}
  {%- endfor -%}
  {{ out | to_json }}
__slm_ansible_role_openclaw_openai_key_var_prefix: OPENCLAW_PROVIDER_

__slm_ansible_role_openclaw_models_config: >-
  {{ ({'models': {'providers': __slm_ansible_role_openclaw_openai_providers_json | from_json}}
      if slm_ansible_role_openclaw_openai_providers | length > 0 else {})
     | combine({'agents': {'defaults': {'model': {'primary': slm_ansible_role_openclaw_default_model}}}}
               if slm_ansible_role_openclaw_default_model | length > 0 else {}) }}

__slm_ansible_role_openclaw_effective_config: >-
  {{ __slm_ansible_role_openclaw_base_config
     | combine(__slm_ansible_role_openclaw_models_config, recursive=True)
     | combine(slm_ansible_role_openclaw_config, recursive=True) }}

# OpenClaw refuses to start in trusted-proxy mode when a token is configured
__slm_ansible_role_openclaw_env_auth: >-
  {{ {'OPENCLAW_GATEWAY_PASSWORD': slm_ansible_role_openclaw_gateway_password}
     if slm_ansible_role_openclaw_proxy_enabled | bool
     else {'OPENCLAW_GATEWAY_TOKEN': slm_ansible_role_openclaw_gateway_token} }}
__slm_ansible_role_openclaw_env_providers_json: >-
  {%- set out = {} -%}
  {%- for p in slm_ansible_role_openclaw_openai_providers if p.api_key | default('') | length > 0 -%}
  {%- set _ = out.update({__slm_ansible_role_openclaw_openai_key_var_prefix ~ (p.id | upper | replace('-', '_')) ~ '_API_KEY': p.api_key}) -%}
  {%- endfor -%}
  {{ out | to_json }}
__slm_ansible_role_openclaw_env_all: >-
  {{ __slm_ansible_role_openclaw_env_auth
     | combine(__slm_ansible_role_openclaw_env_providers_json | from_json)
     | combine(slm_ansible_role_openclaw_env) }}
