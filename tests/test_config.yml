---
# Fast local test of the rendered gateway config and .env entries. Only the
# role's defaults and vars are loaded; nothing is installed.
- name: TEST | Gateway config
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../defaults/main.yml
    - ../vars/main.yml
    # Shared inputs; a later vars file overrides the role defaults above
    - config_inputs.yml
  tasks:
    - name: Proxy disabled
      ansible.builtin.include_tasks: assert_config.yml
      vars:
        __case: proxy disabled
        slm_ansible_role_openclaw_proxy_enabled: false
        __checks:
          - "__c.gateway.auth == {'mode': 'token', 'token': '${OPENCLAW_GATEWAY_TOKEN}'}"
          - "'publicOrigin' not in __c.gateway"
          - "'trustedProxies' not in __c.gateway"
          - "__e.keys() | list == ['OPENCLAW_GATEWAY_TOKEN']"

    - name: Proxy basic
      ansible.builtin.include_tasks: assert_config.yml
      vars:
        __case: proxy basic
        __checks:
          - "__c.gateway.mode == 'local'"
          - "__c.gateway.bind == 'loopback'"
          - "__c.gateway.port == 18789"
          - "__c.gateway.publicOrigin == 'https://192.0.2.10'"
          - "__c.gateway.trustedProxies == ['127.0.0.1']"
          - "__c.gateway.auth.mode == 'trusted-proxy'"
          - "__c.gateway.auth.password == '${OPENCLAW_GATEWAY_PASSWORD}'"
          - "'token' not in __c.gateway.auth"
          - "__c.gateway.auth.identityScopes == {'alice': ['operator.admin']}"
          - >-
            __c.gateway.auth.trustedProxy == {'userHeader': 'x-forwarded-user',
            'requiredHeaders': ['x-forwarded-proto', 'x-forwarded-host'],
            'allowUsers': ['alice', 'bob'], 'allowLoopback': True,
            'deviceAutoApprove': {'enabled': True}}
          - "'OPENCLAW_GATEWAY_TOKEN' not in __e"
          - "__e.OPENCLAW_GATEWAY_PASSWORD == 'pw'"

    - name: Proxy oidc
      ansible.builtin.include_tasks: assert_config.yml
      vars:
        __case: proxy oidc
        slm_ansible_role_openclaw_proxy_auth: oidc
        slm_ansible_role_openclaw_proxy_oidc_allowed_emails:
          - alice@example.com
        slm_ansible_role_openclaw_proxy_admin_users:
          - alice@example.com
        __checks:
          - "__c.gateway.auth.trustedProxy.allowUsers == ['alice@example.com']"
          - "__c.gateway.auth.identityScopes == {'alice@example.com': ['operator.admin']}"

    - name: Custom https port
      ansible.builtin.include_tasks: assert_config.yml
      vars:
        __case: custom https port
        slm_ansible_role_openclaw_proxy_https_port: 8443
        __checks:
          - "__c.gateway.publicOrigin == 'https://192.0.2.10:8443'"
          - "__slm_ansible_role_openclaw_proxy_origin == 'https://192.0.2.10:8443'"

    - name: User override merges
      ansible.builtin.include_tasks: assert_config.yml
      vars:
        __case: user override merges
        slm_ansible_role_openclaw_config:
          gateway:
            auth:
              trustedProxy:
                allowUsers:
                  - carol
        __checks:
          - "__c.gateway.auth.trustedProxy.allowUsers == ['carol']"
          - "__c.gateway.auth.trustedProxy.allowLoopback"

    - name: No admin users
      ansible.builtin.include_tasks: assert_config.yml
      vars:
        __case: no admin users
        slm_ansible_role_openclaw_proxy_admin_users: []
        __checks:
          - "'identityScopes' not in __c.gateway.auth"

    - name: Openai providers
      ansible.builtin.include_tasks: assert_config.yml
      vars:
        __case: openai providers
        slm_ansible_role_openclaw_openai_providers:
          - id: vllm-gpu
            base_url: https://vllm.example.com/v1
            api_key: secret-key
            api: openai-responses
            models:
              - {id: qwen3-32b, name: Qwen3 32B, context_window: 131072, max_tokens: 8192, input: [text, image]}
          - id: ollama
            base_url: http://127.0.0.1:11434/v1
            models:
              - {id: llama3.1}
        slm_ansible_role_openclaw_default_model: vllm-gpu/qwen3-32b
        __checks:
          - >-
            __c.models.providers['vllm-gpu'] == {'baseUrl': 'https://vllm.example.com/v1',
            'api': 'openai-responses', 'apiKey': '${OPENCLAW_PROVIDER_VLLM_GPU_API_KEY}',
            'models': [{'id': 'qwen3-32b', 'name': 'Qwen3 32B', 'contextWindow': 131072,
            'maxTokens': 8192, 'input': ['text', 'image']}]}
          - >-
            __c.models.providers.ollama == {'baseUrl': 'http://127.0.0.1:11434/v1',
            'api': 'openai-completions', 'apiKey': 'no-key', 'models': [{'id': 'llama3.1', 'name': 'llama3.1'}]}
          - "__c.agents.defaults.model.primary == 'vllm-gpu/qwen3-32b'"
          - "__c.agents.defaults.workspace is defined"
          - "__e.OPENCLAW_PROVIDER_VLLM_GPU_API_KEY == 'secret-key'"
          - "'OPENCLAW_PROVIDER_OLLAMA_API_KEY' not in __e"
          - "'secret-key' not in __c | to_json"

    - name: No openai providers
      ansible.builtin.include_tasks: assert_config.yml
      vars:
        __case: no openai providers
        __checks:
          - "'models' not in __c"
          - "'model' not in __c.agents.defaults"

    - name: Discovered models
      ansible.builtin.include_tasks: assert_config.yml
      vars:
        __case: discovered models
        slm_ansible_role_openclaw_openai_providers:
          - id: litellm
            base_url: http://10.0.0.5:4000/v1
          - id: vllm
            base_url: http://10.0.0.6:8000/v1
            models: []
          - id: fixed
            base_url: http://10.0.0.7:8000/v1
            models:
              - {id: only-this}
        # Set by tasks/install/models.yml from GET <base_url>/models
        __slm_ansible_role_openclaw_discovered_models:
          litellm: [gpt-4o, claude-sonnet]
          vllm: [qwen3-32b]
        __checks:
          # OpenClaw requires a name; it defaults to the id
          - >-
            __c.models.providers.litellm.models == [{'id': 'gpt-4o', 'name': 'gpt-4o'},
            {'id': 'claude-sonnet', 'name': 'claude-sonnet'}]
          - "__c.models.providers.vllm.models == [{'id': 'qwen3-32b', 'name': 'qwen3-32b'}]"
          - "__c.models.providers.fixed.models == [{'id': 'only-this', 'name': 'only-this'}]"
