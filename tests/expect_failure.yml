---
# Included once per case by test_validation.yml: the role's input validation
# must reject the case's input with a fail_msg containing item.expect. Unset
# keys fall back to a valid basic-auth proxy setup.
- name: "Reset result for case: {{ item.name }}"
  ansible.builtin.set_fact:
    __case_failed: false
    __case_msg: ''

- name: "Run validation for case: {{ item.name }}"
  block:
    - name: "Include role validation for case: {{ item.name }}"
      ansible.builtin.include_role:
        name: "{{ playbook_dir | dirname }}"
        tasks_from: validate.yml
      vars:
        slm_ansible_role_openclaw_env: "{{ item.env | default({}) }}"
        slm_ansible_role_openclaw_gateway_token: "{{ item.token | default('valid-token') }}"
        slm_ansible_role_openclaw_state: "{{ item.state | default('present') }}"
        slm_ansible_role_openclaw_gateway_password: "{{ item.password | default('valid-password') }}"
        slm_ansible_role_openclaw_proxy_enabled: "{{ item.proxy_enabled | default(true) }}"
        slm_ansible_role_openclaw_proxy_auth: "{{ item.proxy_auth | default('basic') }}"
        slm_ansible_role_openclaw_proxy_tls: "{{ item.proxy_tls | default('internal') }}"
        slm_ansible_role_openclaw_proxy_hostname: "{{ item.hostname | default('192.0.2.10') }}"
        slm_ansible_role_openclaw_proxy_https_port: "{{ item.https_port | default(443) }}"
        slm_ansible_role_openclaw_proxy_tls_cert_file: "{{ item.tls_cert_file | default('') }}"
        slm_ansible_role_openclaw_proxy_tls_key_file: "{{ item.tls_key_file | default('') }}"
        slm_ansible_role_openclaw_proxy_acme_email: "{{ item.acme_email | default('') }}"
        slm_ansible_role_openclaw_proxy_admin_users: "{{ item.admin_users | default([]) }}"
        slm_ansible_role_openclaw_proxy_basic_users: "{{ item.basic_users | default([{'name': 'alice', 'password_hash': '$2b$14$abc'}]) }}"
        slm_ansible_role_openclaw_proxy_oidc_issuer_url: "{{ (item.oidc | default({})).issuer_url | default('') }}"
        slm_ansible_role_openclaw_proxy_oidc_client_id: "{{ (item.oidc | default({})).client_id | default('') }}"
        slm_ansible_role_openclaw_proxy_oidc_client_secret: "{{ (item.oidc | default({})).client_secret | default('') }}"
        slm_ansible_role_openclaw_proxy_oidc_cookie_secret: "{{ (item.oidc | default({})).cookie_secret | default('') }}"
        slm_ansible_role_openclaw_proxy_oidc_allowed_emails: "{{ (item.oidc | default({})).allowed_emails | default([]) }}"
        slm_ansible_role_openclaw_openai_providers: "{{ item.providers | default([]) }}"
        slm_ansible_role_openclaw_default_model: "{{ item.default_model | default('') }}"

  rescue:
    - name: "Record failure for case: {{ item.name }}"
      ansible.builtin.set_fact:
        __case_failed: true
        __case_msg: "{{ ansible_failed_result.msg | default('') }}"

- name: "Assert validation rejected case: {{ item.name }}"
  ansible.builtin.assert:
    that:
      - __case_failed | bool
      - item.expect in __case_msg
    fail_msg: >-
      Case '{{ item.name }}' was not rejected as expected
      (failed={{ __case_failed }}, msg={{ __case_msg }}).
    success_msg: "Case '{{ item.name }}' rejected as expected"
