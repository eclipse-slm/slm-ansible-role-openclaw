---
- name: Include Node.js tasks
  ansible.builtin.include_tasks: install/nodejs.yml

- name: Include service user tasks
  ansible.builtin.include_tasks: install/user.yml

- name: Include package tasks
  ansible.builtin.include_tasks: install/package.yml

- name: Include config tasks
  ansible.builtin.include_tasks: install/config.yml

- name: Include service tasks
  ansible.builtin.include_tasks: install/service.yml

- name: Include reverse proxy tasks
  ansible.builtin.include_tasks: install/proxy.yml
  when: slm_ansible_role_openclaw_proxy_enabled | bool
