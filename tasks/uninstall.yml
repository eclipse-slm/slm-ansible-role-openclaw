---
- name: Stat systemd unit
  ansible.builtin.stat:
    path: "{{ __slm_ansible_role_openclaw_unit_path }}"
  register: __slm_ansible_role_openclaw_unit_stat

- name: Stop and disable gateway service
  ansible.builtin.systemd_service:
    name: "{{ slm_ansible_role_openclaw_service_name }}"
    state: stopped
    enabled: false
  when: __slm_ansible_role_openclaw_unit_stat.stat.exists

- name: Remove systemd unit
  ansible.builtin.file:
    path: "{{ __slm_ansible_role_openclaw_unit_path }}"
    state: absent
  notify: Reload systemd

- name: Stat npm binary
  ansible.builtin.stat:
    path: /usr/bin/npm
  register: __slm_ansible_role_openclaw_npm_stat

- name: Remove openclaw package
  when: __slm_ansible_role_openclaw_npm_stat.stat.exists
  block:
    - name: Read installed openclaw package
      ansible.builtin.command: npm ls -g --depth=0 --json openclaw
      changed_when: false
      failed_when: __slm_ansible_role_openclaw_npm_ls.rc not in [0, 1]
      register: __slm_ansible_role_openclaw_npm_ls

    - name: Uninstall openclaw package
      ansible.builtin.command: npm uninstall -g openclaw
      when: >-
        'openclaw' in ((__slm_ansible_role_openclaw_npm_ls.stdout | default('{}', true) | from_json).dependencies | default({}))
      changed_when: true

- name: Purge state directory, user and group
  when: slm_ansible_role_openclaw_uninstall_purge | bool
  block:
    - name: Remove state directory
      ansible.builtin.file:
        path: "{{ slm_ansible_role_openclaw_state_dir }}"
        state: absent

    - name: Remove service user
      ansible.builtin.user:
        name: "{{ slm_ansible_role_openclaw_user }}"
        state: absent
        remove: true

    - name: Remove service group
      ansible.builtin.group:
        name: "{{ slm_ansible_role_openclaw_group }}"
        state: absent

- name: Remove Node.js and the NodeSource repository
  when: slm_ansible_role_openclaw_uninstall_nodejs | bool
  block:
    - name: Remove Node.js
      ansible.builtin.apt:
        name: nodejs
        state: absent
        purge: true

    # deb822_repository needs python3-debian even for state absent
    - name: Stat NodeSource repository
      ansible.builtin.stat:
        path: /etc/apt/sources.list.d/nodesource.sources
      register: __slm_ansible_role_openclaw_nodesource_stat

    - name: Remove NodeSource repository
      ansible.builtin.deb822_repository:
        name: nodesource
        state: absent
      when: __slm_ansible_role_openclaw_nodesource_stat.stat.exists

- name: Stat oauth2-proxy unit
  ansible.builtin.stat:
    path: "{{ __slm_ansible_role_openclaw_oauth2_proxy_unit_path }}"
  register: __slm_ansible_role_openclaw_oauth2_proxy_unit_stat

- name: Stop and disable oauth2-proxy
  ansible.builtin.systemd_service:
    name: oauth2-proxy
    state: stopped
    enabled: false
  when: __slm_ansible_role_openclaw_oauth2_proxy_unit_stat.stat.exists

- name: Remove oauth2-proxy files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ __slm_ansible_role_openclaw_oauth2_proxy_unit_path }}"
    - "{{ __slm_ansible_role_openclaw_oauth2_proxy_bin }}"
    - "{{ __slm_ansible_role_openclaw_oauth2_proxy_conf_dir }}"
  notify: Reload systemd

- name: Remove oauth2-proxy user
  ansible.builtin.user:
    name: oauth2-proxy
    state: absent

- name: Remove oauth2-proxy group
  ansible.builtin.group:
    name: oauth2-proxy
    state: absent

- name: Remove copied TLS certificate and key
  ansible.builtin.file:
    path: "{{ __slm_ansible_role_openclaw_caddy_cert_dir }}/{{ item }}"
    state: absent
  loop:
    - openclaw.crt
    - openclaw.key

- name: Remove Caddy and its repository
  when: slm_ansible_role_openclaw_uninstall_caddy | bool
  block:
    - name: Remove Caddy
      ansible.builtin.apt:
        name: caddy
        state: absent
        purge: true

    - name: Remove Caddy configuration
      ansible.builtin.file:
        path: /etc/caddy
        state: absent

    # deb822_repository needs python3-debian even for state absent
    - name: Stat Caddy repository
      ansible.builtin.stat:
        path: /etc/apt/sources.list.d/caddy-stable.sources
      register: __slm_ansible_role_openclaw_caddy_repo_stat

    - name: Remove Caddy repository
      ansible.builtin.deb822_repository:
        name: caddy-stable
        state: absent
      when: __slm_ansible_role_openclaw_caddy_repo_stat.stat.exists
