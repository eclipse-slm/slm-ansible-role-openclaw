---
roles:
  - name: molecule_generic
    src: https://github.com/eclipse-slm/molecule_generic.git
    scm: git
    version: main

  # molecule_generic includes its backends by these names
  - name: molecule_kubevirt
    src: https://github.com/eclipse-slm/molecule_kubevirt.git
    scm: git
    version: main

  # eclipse-slm/molecule_openstack is not installable yet; this role has the
  # same create.yml/destroy.yml entry points
  - name: molecule_openstack
    src: ipa-big.molecule_openstack
    version: 1.0.11

collections:
  - name: community.crypto
    version: ">=2.0.0"
  - name: community.general
    version: ">=9.0.0"
  - name: kubernetes.core
    version: ">=2.4.0"
  - name: openstack.cloud
    version: ">=2.0.0"
